---
name: sed Benchmark - dspinellis sed (Rust, optimized)
author: arne@green-coding.io
description: Measures energy cost of sed text substitution using the dspinellis Rust sed with zero-copy mmap I/O and fast regex optimizations on the enwik8 benchmark corpus

custom_metrics:
  processed_mb:
    unit: MB
    sci: True

services:
  rust:
    image: rust:latest
    volumes:
      - ../../sed:/tmp/dspinellis-src:ro
    setup-commands:
      - command: apt-get update && apt-get install -y curl unzip
      - command: cargo build --release --manifest-path /tmp/dspinellis-src/Cargo.toml --target-dir /tmp/dspinellis-build

flow:
  - name: Prepare
    container: rust
    commands:
      - type: console
        command: curl -sS -o /tmp/enwik8.zip https://mattmahoney.net/dc/enwik8.zip
        note: Download enwik8 standard 100MB text benchmark corpus (36MB zip)
      - type: console
        command: unzip /tmp/enwik8.zip -d /tmp/
        note: Extract 100MB Wikipedia XML text file
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=1 of=/tmp/enwik8_1mb
        note: Create exact 1MB slice for small file test
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=10 of=/tmp/enwik8_10mb
        note: Create exact 10MB slice for medium file test

  - name: Substitute 1 MB
    container: rust
    commands:
      - type: console
        command: /tmp/dspinellis-build/release/sed 's/the /THE /g' /tmp/enwik8_1mb > /dev/null
        shell: bash
        note: Replace all occurrences of 'the ' with 'THE ' in 1MB file using dspinellis sed
      - type: console
        command: echo "$(date +%s%N) processed_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB processing

  - name: Substitute 10 MB
    container: rust
    commands:
      - type: console
        command: /tmp/dspinellis-build/release/sed 's/the /THE /g' /tmp/enwik8_10mb > /dev/null
        shell: bash
        note: Replace all occurrences of 'the ' with 'THE ' in 10MB file using dspinellis sed
      - type: console
        command: echo "$(date +%s%N) processed_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB processing

  - name: Substitute 100 MB
    container: rust
    commands:
      - type: console
        command: /tmp/dspinellis-build/release/sed 's/the /THE /g' /tmp/enwik8 > /dev/null
        shell: bash
        note: Replace all occurrences of 'the ' with 'THE ' in 100MB file using dspinellis sed
      - type: console
        command: echo "$(date +%s%N) processed_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB processing
