---
name: sed Benchmark - uutils sed (Rust)
author: arne@green-coding.io
description: Measures energy cost of sed text substitution using the uutils Rust reimplementation of sed (v0.1.1) on the enwik8 benchmark corpus

custom_metrics:
  processed_mb:
    unit: MB
    sci: True

services:
  rust:
    image: rust:latest
    setup-commands:
      - command: apt-get update && apt-get install -y curl
      - command: git clone --depth 1 --branch 0.1.1 https://github.com/uutils/sed.git /tmp/uutils-src
      - command: cargo build --release --manifest-path /tmp/uutils-src/Cargo.toml --target-dir /tmp/uutils-build

flow:
  - name: Prepare
    container: rust
    commands:
      - type: console
        command: curl -sS -o /tmp/enwik8.gz http://download.green-coding.io:8080/enwik8.gz
        note: Download enwik8 standard 100MB text benchmark corpus (36MB zip)
      - type: console
        command: gunzip /tmp/enwik8.gz -d /tmp/
        note: Extract 100MB Wikipedia XML text file
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=1 of=/tmp/enwik8_1mb
        note: Create exact 1MB slice for small file test
      - type: console
        command: dd if=/tmp/enwik8 bs=1048576 count=10 of=/tmp/enwik8_10mb
        note: Create exact 10MB slice for medium file test

  - name: Substitute 1 MB
    container: rust
    commands:
      - type: console
        command: /tmp/uutils-build/release/sed 's/the /THE /g' /tmp/enwik8_1mb > /dev/null
        shell: bash
        note: Replace all occurrences of 'the ' with 'THE ' in 1MB file using uutils sed
      - type: console
        command: echo "$(date +%s%N) processed_mb=1"
        shell: bash
        note: Emit SCI metric for 1MB processing

  - name: Substitute 10 MB
    container: rust
    commands:
      - type: console
        command: /tmp/uutils-build/release/sed 's/the /THE /g' /tmp/enwik8_10mb > /dev/null
        shell: bash
        note: Replace all occurrences of 'the ' with 'THE ' in 10MB file using uutils sed
      - type: console
        command: echo "$(date +%s%N) processed_mb=10"
        shell: bash
        note: Emit SCI metric for 10MB processing

  - name: Substitute 100 MB
    container: rust
    commands:
      - type: console
        command: /tmp/uutils-build/release/sed 's/the /THE /g' /tmp/enwik8 > /dev/null
        shell: bash
        note: Replace all occurrences of 'the ' with 'THE ' in 100MB file using uutils sed
      - type: console
        command: echo "$(date +%s%N) processed_mb=100"
        shell: bash
        note: Emit SCI metric for 100MB processing
