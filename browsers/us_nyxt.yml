---
name: nyxt
author: Didi Hoffmann
description: This is the green code label benchmark script

ignore-unsupported-compose: true

label:
  - open_source: true
  - no_advertisement: true
  - free_updates: true
  - documentation_link: http://docs.green-coding.io
  - website_link: http://www.green-coding.io
  - sub_packages:
  - file_formats:
    - text/pdf
  - accessibility: true
  - architectures:
    - x86
    - arm64


services:
  bench-service:
    image: ribalba/nyxt
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ":0"
    docker-run-args:
      - --shm-size=4gb
      - --privileged

    networks:
      - benchmark
    setup-commands:
      - command: apt update
      - command: apt install -y flatpak
      - command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

  speedometer:
    build: .
    container_name: speedometer
    ports:
      - "8080:8080"
    networks:
      - benchmark

flow:
  - name: install
    container: bench-service
    commands:
      - type: console
        command: flatpak install -y --noninteractive flathub engineer.atlas.Nyxt



  - name: idle
    container: bench-service
    commands:
      - type: console
        command: timeout -s SIGKILL 60 runuser -u nyxtuser ./nyxt
        ignore-errors: True



  - name: run
    container: bench-service
    commands:
      - type: console
        command: timeout -s SIGKILL 120 runuser -u nyxtuser ./nyxt  http://speedometer:8080?startAutomatically=true
        ignore-errors: True



  - name: uninstall
    container: bench-service
    commands:
      - type: console
        command: flatpak uninstall -y engineer.atlas.Nyxt

networks:
  benchmark:

