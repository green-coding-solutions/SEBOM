---
name: chrome
author: Didi Hoffmann
description: This is the green code label benchmark script

ignore-unsupported-compose: true

label:
  - open_source: true
  - no_advertisement: true
  - free_updates: true
  - documentation_link: http://docs.green-coding.io
  - website_link: http://www.green-coding.io
  - sub_packages:
  - file_formats:
    - text/pdf
  - accessibility: true
  - architectures:
    - x86
    - arm64
services:
  bench-service:
    image: ubuntu:24.04
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ":0"
    docker-run-args:
      - --shm-size=4gb
      - --security-opt seccomp=unconfined
    setup-commands:
      - command: echo "tzdata tzdata/Areas select Europe" | debconf-set-selections
        shell: /bin/bash
      - command: echo "tzdata tzdata/Zones/Europe select Berlin" | debconf-set-selections
        shell: /bin/bash
      - command: echo 'Acquire::http::Proxy "http://192.168.1.243:3142";' >> /etc/apt/apt.conf.d/01proxy
        shell: /bin/bash
      - command: echo 'Acquire::HTTPS::Proxy "false";' >> /etc/apt/apt.conf.d/01proxy
        shell: /bin/bash
      - command: apt update
      - command: apt install -y xxd
      - command: apt install -y wget
      - command: 'head -c 16 /dev/urandom | xxd -p > /etc/machine-id'
        shell: /bin/bash
      - command: install -d -m 0755 /etc/apt/keyrings
      - command: 'wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- | tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null'
        shell: /bin/bash
      - command: 'echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" | tee -a /etc/apt/sources.list.d/mozilla.list > /dev/null'
        shell: /bin/bash
      - command: |
          echo '
          Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000
          ' | tee /etc/apt/preferences.d/mozilla
        shell: /bin/bash
      - command: apt update
    networks:
      - benchmark



  speedometer:
    build: .
    container_name: speedometer
    ports:
      - "8080:8080"
    networks:
      - benchmark

flow:
  - name: install
    container: bench-service
    commands:
      - type: console
        command: apt install -y firefox



  - name: idle
    container: bench-service
    commands:
      - type: console
        command: timeout -s SIGKILL 60 firefox -setDefaultBrowser
        ignore-errors: True



  - name: run
    container: bench-service
    commands:
      - type: console
        command: timeout -s SIGKILL 120 firefox -setDefaultBrowser http://speedometer:8080?startAutomatically=true
        ignore-errors: True



  - name: uninstall
    container: bench-service
    commands:
      - type: console
        command: apt purge --auto-remove -y firefox

networks:
  benchmark:

